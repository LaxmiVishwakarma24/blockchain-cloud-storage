{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Create account</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
        <div class="form-text">At least 8 characters with upper case, lower case and a digit.</div></div>
      <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 small mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div></div>
</div></div>
{% endblock %}
