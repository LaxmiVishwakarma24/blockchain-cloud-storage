{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Choose a new password</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="password">New password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required></div>
      <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary w-100">Reset password</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
