{% extends "base.html" %}
{% block title %}Versions{% endblock %}
{% block content %}
<div id="versions-root" data-file-id="{{ file_id }}">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Versions of {{ file_name }}</h1>
    <a class="btn btn-outline-secondary" href="{{ url_for('files.files_page') }}">Back to files</a>
  </div>
  <div id="message" role="status"></div>
  <div class="card shadow-sm mb-4"><div class="card-body">
    <form id="version-form" class="row g-2 align-items-end">
      <div class="col-md-9">
        <label class="form-label" for="file">Add a new version (same file type)</label>
        <input class="form-control" type="file" id="file" name="file" required>
      </div>
      <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Upload new version</button></div>
    </form>
  </div></div>
  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr><th>Version</th><th>Size</th><th>SHA-256</th><th>By</th><th>Date</th><th>Encrypted</th><th></th></tr></thead>
      <tbody id="version-rows"></tbody>
    </table>
  </div>
</div>
<script src="{{ url_for('static', filename='js/versions.js') }}"></script>
{% endblock %}
