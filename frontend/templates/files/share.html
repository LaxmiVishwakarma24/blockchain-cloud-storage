{% extends "base.html" %}
{% block title %}Share{% endblock %}
{% block content %}
<div id="share-root" data-file-id="{{ file_id }}">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Share {{ file_name }}</h1>
    <a class="btn btn-outline-secondary" href="{{ url_for('files.files_page') }}">Back to files</a>
  </div>
  <div id="message" role="status"></div>
  <div class="card shadow-sm mb-4"><div class="card-body">
    <form id="share-form" class="row g-3" novalidate>
      <div class="col-md-5">
        <label class="form-label" for="email">Share with (email)</label>
        <input class="form-control" id="email" type="email" required>
      </div>
      <div class="col-md-4">
        <span class="form-label d-block">Permissions</span>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="p-view" checked disabled><label class="form-check-label" for="p-view">View</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input perm" type="checkbox" id="p-download" value="DOWNLOAD" checked><label class="form-check-label" for="p-download">Download</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input perm" type="checkbox" id="p-modify" value="MODIFY"><label class="form-check-label" for="p-modify">Modify</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input perm" type="checkbox" id="p-verify" value="VERIFY"><label class="form-check-label" for="p-verify">Verify</label></div>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="expires">Expires (optional)</label>
        <input class="form-control" id="expires" type="date">
      </div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Share</button></div>
    </form>
  </div></div>
  <h2 class="h5">Current shares</h2>
  <div class="table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr><th>Shared with</th><th>Permissions</th><th>Expires</th><th>Status</th><th></th></tr></thead>
      <tbody id="share-rows"></tbody>
    </table>
  </div>
</div>
<script src="{{ url_for('static', filename='js/share.js') }}"></script>
{% endblock %}
